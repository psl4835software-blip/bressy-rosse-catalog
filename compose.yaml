name: bressy-rosse

services:
  web:
    image: bressy-rosse-web:dev
    build:
      context: .
      target: development
    command:
      - sh
      - -lc
      - npm run db:migrate:local && exec npm run dev -- --hostname 0.0.0.0
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXTJS_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - wrangler_state:/app/.wrangler
    networks:
      - catalog-dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  node_modules:
  next_cache:
  wrangler_state:

networks:
  catalog-dev:
    driver: bridge
